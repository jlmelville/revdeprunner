name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          # Explicit labels keep both Mac architectures covered as latest moves.
          - { os: macos-15, r: "release", arch: "aarch64" }
          - { os: macos-15-intel, r: "release", arch: "x86_64" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Verify integration prerequisites
        env:
          EXPECTED_R_ARCH: ${{ matrix.config.arch }}
        shell: Rscript {0}
        run: |
          source("R/stock-runtime.R")
          require_stock_adapter_tools()
          stopifnot(nzchar(Sys.which("cc")))
          if (Sys.info()[["sysname"]] == "Darwin") {
            stopifnot(startsWith(.Platform$pkgType, "mac.binary"))
            stopifnot(identical(R.version$arch, Sys.getenv("EXPECTED_R_ARCH")))
          }
          print(R.version)
          print(.Platform$pkgType)

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          args: 'c("--no-manual")'
